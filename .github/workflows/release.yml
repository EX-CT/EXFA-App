name: release
# On an mcp-v* tag: test packages/mcp, pack the npm tarball (dist/ prebuilt, so it installs without a TypeScript
# build), smoke-test the packed package via npx, and publish a GitHub Release with the tarball and checksums.
# No npm registry publish: install straight from the release asset (see packages/mcp README "Install").
on:
  push:
    tags: ["mcp-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: Tag matches packages/mcp version
        working-directory: packages/mcp
        run: |
          V=$(node -p "require('./package.json').version")
          [ "$TAG" = "mcp-v$V" ] || { echo "tag $TAG != packages/mcp version mcp-v$V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test -w packages/mcp
      - name: Pack
        working-directory: packages/mcp
        run: |
          mkdir -p out
          npm pack --pack-destination out
          cp "out/ex-ct-exfa-mcp-$VERSION.tgz" out/exfa-mcp.tgz   # stable name for releases/latest/download/
          (cd out && sha256sum *.tgz > SHA256SUMS)
          cat out/SHA256SUMS
      - name: Smoke test the packed package (npx, as users install it)
        run: |
          cd "$RUNNER_TEMP"
          npx -y --package="$GITHUB_WORKSPACE/packages/mcp/out/exfa-mcp.tgz" exfa-mcp --help | tee help.txt
          grep -q "exfa-mcp $VERSION" help.txt
      - name: Publish GitHub Release
        working-directory: packages/mcp
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/exfa-mcp-$VERSION.tgz"
          {
            echo "exfa-mcp $VERSION — MCP server for EVE Online fitting (engine-agnostic, exfa contract)."
            echo
            echo "Install (Node >= 20, the default engine \`exfa\` from EX-CT/EXFA-Engine on PATH, and a dataset from EX-CT/EXFA-Data):"
            echo
            echo '```bash'
            echo "npx -y --package=$URL exfa-mcp --help"
            echo "npm install -g $URL     # or install globally"
            echo '```'
            echo
            echo "MCP client config: see packages/mcp/README.md. Built by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          } > notes.md
          cp out/ex-ct-exfa-mcp-$VERSION.tgz out/exfa-mcp-$VERSION.tgz
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/exfa-mcp*.tgz out/SHA256SUMS --clobber
          else
            gh release create "$TAG" out/exfa-mcp*.tgz out/SHA256SUMS --title "exfa-mcp $VERSION" --notes-file notes.md --verify-tag
          fi
          echo "Published ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
